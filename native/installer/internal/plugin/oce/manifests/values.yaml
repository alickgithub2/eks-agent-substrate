# Helm values for OCE's chart (deploy/helm/openclaw-enterprise at
# ChartRevision), reached by kubectl port-forward only: no gateway routing
# (Envoy Gateway), no native admin, no TLS or DNS. The oce plugin fills the
# REPLACE_WITH_ values: the controller image by digest, the database's and
# the Kubernetes API's /32s, which the chart's NetworkPolicies allow.
images:
  controller: REPLACE_WITH_CONTROLLER_IMAGE
auth:
  baseUrl: http://127.0.0.1:8080
  secretName: occ-auth
agentNativeAdmin:
  enabled: false
gatewayRouting:
  enabled: false
bootstrap:
  adminEmail: admin@oce.local
  password:
    claimName: occ-bootstrap
database:
  secretName: occ-database
  cidrs: [REPLACE_WITH_DATABASE_CIDRS]
  port: 5432
cluster:
  cidrs: [REPLACE_WITH_CLUSTER_CIDRS]
  port: 443
api:
  port: 8080
  clients:
    - namespace: openclaw-system
      podLabels:
        app: occ-relay
dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns
# One block for the migration and bootstrap Job, the API and the worker: the
# chart's 500m default CPU limit stalls the migration (issue #133).
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
