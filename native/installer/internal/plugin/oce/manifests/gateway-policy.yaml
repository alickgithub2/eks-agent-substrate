# MutatingAdmissionPolicy that gives each OCE Agent gateway Pod what the
# oce-substrate-bridge plugin needs to run the Agent's conversations as
# Substrate actors, without changing OCE: OCE's Kubernetes Compute builds the
# Pod, and this adds, at admission,
#   - ate-api: a ServiceAccount token for ate-api-server (audience
#     api.ate-system.svc), which kubectl-ate presents as --token-file;
#   - router-client: a podidentity pod certificate and the servicedns CA, the
#     mTLS client identity the bridge presents to atenet-router;
#   - the ROUTER_* variables, and OPENCLAW_ACTOR_TOKEN from Secret
#     oce-substrate-actor (the actors' bearer token).
# Only Pods labeled openclaw.dev/workload-role=gateway in namespaces OCE manages
# and the oce plugin enabled (oce.substrate/enabled=true) match. The mutation is
# additive: it adds named volumes, mounts and variables and changes nothing
# OCE set.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: oce-substrate-gateway
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: openclaw-enterprise
        oce.substrate/enabled: "true"
    objectSelector:
      matchLabels:
        openclaw.dev/workload-role: gateway
  matchConditions:
    - name: has-gateway-container
      expression: object.spec.containers.exists(c, c.name == "gateway")
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "ate-api",
                  projected: Object.spec.volumes.projected{sources: [
                    Object.spec.volumes.projected.sources{serviceAccountToken: Object.spec.volumes.projected.sources.serviceAccountToken{
                      audience: "api.ate-system.svc", expirationSeconds: 3600, path: "token"}}
                  ]}
                },
                Object.spec.volumes{
                  name: "router-client",
                  projected: Object.spec.volumes.projected{sources: [
                    Object.spec.volumes.projected.sources{podCertificate: Object.spec.volumes.projected.sources.podCertificate{
                      signerName: "podidentity.podcert.ate.dev/identity", keyType: "ECDSAP256", credentialBundlePath: "credential-bundle.pem"}},
                    Object.spec.volumes.projected.sources{clusterTrustBundle: Object.spec.volumes.projected.sources.clusterTrustBundle{
                      signerName: "servicedns.podcert.ate.dev/identity",
                      labelSelector: Object.spec.volumes.projected.sources.clusterTrustBundle.labelSelector{matchLabels: {"podcert.ate.dev/canarying": "live"}},
                      path: "router-ca.pem"}}
                  ]}
                }
              ],
              containers: [
                Object.spec.containers{
                  name: "gateway",
                  env: [
                    Object.spec.containers.env{name: "ROUTER_URL", value: "https://atenet-router.ate-system.svc.cluster.local:443"},
                    Object.spec.containers.env{name: "ROUTER_SERVER_NAME", value: "atenet-router.ate-system.svc"},
                    Object.spec.containers.env{name: "ROUTER_CA_FILE", value: "/var/run/router-client/router-ca.pem"},
                    Object.spec.containers.env{name: "ROUTER_CLIENT_CERT", value: "/var/run/router-client/credential-bundle.pem"},
                    Object.spec.containers.env{name: "OPENCLAW_ACTOR_TOKEN", valueFrom: Object.spec.containers.env.valueFrom{
                      secretKeyRef: Object.spec.containers.env.valueFrom.secretKeyRef{name: "oce-substrate-actor", key: "actor-token"}}}
                  ],
                  volumeMounts: [
                    Object.spec.containers.volumeMounts{name: "ate-api", mountPath: "/var/run/ate-api", readOnly: true},
                    Object.spec.containers.volumeMounts{name: "router-client", mountPath: "/var/run/router-client", readOnly: true}
                  ]
                }
              ]
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: oce-substrate-gateway
spec:
  policyName: oce-substrate-gateway
